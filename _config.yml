title: "Programming — The Complete Guide"
description: "From Bytecode to Dynamic Programming: how Python really executes, how to write code that writes code, and the algorithmic techniques that recur in real work."
baseurl: "/programming"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

exclude:
  - tools/
  - "bench/*.py"
  - Gemfile
  - Gemfile.lock
  - vendor/

